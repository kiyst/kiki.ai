<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-label="Bar chart of memory added over 40 requests for four settings"><style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#52514e;stroke-opacity:.18}
.axis{stroke:#52514e;stroke-opacity:.5}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}
.s1s{stroke:#2a78d6}.s2s{stroke:#eb6834}.s3s{stroke:#1baf7a}.gap{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}
.grid{stroke:#c3c2b7}.axis{stroke:#c3c2b7}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}
.s1s{stroke:#3987e5}.s2s{stroke:#d95926}.s3s{stroke:#199e70}.gap{stroke:#1a1a19}}
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
</style><rect class="bg" width="860" height="310" rx="8"/><text class="t1" x="24" y="32" font-size="16" font-weight="600">Memory growth comes from the prompt cache, in every model</text><text class="t2" x="24" y="52" font-size="12">Megabytes added to the model process over 40 different requests</text><line class="grid" x1="290.0" x2="290.0" y1="74" y2="240"/><text class="t2" x="290.0" y="256" font-size="11" text-anchor="middle">0</text><line class="grid" x1="410.0" x2="410.0" y1="74" y2="240"/><text class="t2" x="410.0" y="256" font-size="11" text-anchor="middle">200</text><line class="grid" x1="530.0" x2="530.0" y1="74" y2="240"/><text class="t2" x="530.0" y="256" font-size="11" text-anchor="middle">400</text><line class="grid" x1="650.0" x2="650.0" y1="74" y2="240"/><text class="t2" x="650.0" y="256" font-size="11" text-anchor="middle">600</text><line class="grid" x1="770.0" x2="770.0" y1="74" y2="240"/><text class="t2" x="770.0" y="256" font-size="11" text-anchor="middle">800</text><text class="t1" x="278" y="103" font-size="12" text-anchor="end">Qwen3 4B, default cache</text><path class="s1" d="M290,88 H757.0 Q761.0,88 761.0,92 V106 Q761.0,110 757.0,110 H290 Z"/><text class="t1" x="769.0" y="103" font-size="12">+785 MB</text><text class="t1" x="278" y="143" font-size="12" text-anchor="end">Gemma 4 E4B, default cache</text><path class="s1" d="M290,128 H542.8 Q546.8,128 546.8,132 V146 Q546.8,150 542.8,150 H290 Z"/><text class="t1" x="554.8" y="143" font-size="12">+428 MB</text><text class="t1" x="278" y="183" font-size="12" text-anchor="end">Gemma 4 E4B, cache capped at 256 MiB</text><path class="s1" d="M290,168 H433.6 Q437.6,168 437.6,172 V186 Q437.6,190 433.6,190 H290 Z"/><text class="t1" x="445.6" y="183" font-size="12">+246 MB</text><text class="t1" x="278" y="223" font-size="12" text-anchor="end">Gemma 4 E4B, cache off</text><text class="t1" x="298.0" y="223" font-size="12">+0 MB</text><text class="t2" x="24" y="296" font-size="11">Ollama 0.40.12. The default cache may grow to 8 GB; the 256 MiB cap levels off by request 30.</text></svg>
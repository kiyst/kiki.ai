<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" role="img" aria-label="Bar chart of typical reply time for three cache settings"><style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#52514e;stroke-opacity:.18}
.axis{stroke:#52514e;stroke-opacity:.5}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}
.s1s{stroke:#2a78d6}.s2s{stroke:#eb6834}.s3s{stroke:#1baf7a}.gap{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}
.grid{stroke:#c3c2b7}.axis{stroke:#c3c2b7}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}
.s1s{stroke:#3987e5}.s2s{stroke:#d95926}.s3s{stroke:#199e70}.gap{stroke:#1a1a19}}
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
</style><rect class="bg" width="860" height="270" rx="8"/><text class="t1" x="24" y="32" font-size="16" font-weight="600">Turning the cache off costs about 0.9 s per reply</text><text class="t2" x="24" y="52" font-size="12">Typical wait for a reply, Gemma 4 E4B for chat and the danger judge</text><line class="grid" x1="290.0" x2="290.0" y1="74" y2="200"/><text class="t2" x="290.0" y="216" font-size="11" text-anchor="middle">0 s</text><line class="grid" x1="386.0" x2="386.0" y1="74" y2="200"/><text class="t2" x="386.0" y="216" font-size="11" text-anchor="middle">0.5 s</text><line class="grid" x1="482.0" x2="482.0" y1="74" y2="200"/><text class="t2" x="482.0" y="216" font-size="11" text-anchor="middle">1 s</text><line class="grid" x1="578.0" x2="578.0" y1="74" y2="200"/><text class="t2" x="578.0" y="216" font-size="11" text-anchor="middle">1.5 s</text><line class="grid" x1="674.0" x2="674.0" y1="74" y2="200"/><text class="t2" x="674.0" y="216" font-size="11" text-anchor="middle">2 s</text><line class="grid" x1="770.0" x2="770.0" y1="74" y2="200"/><text class="t2" x="770.0" y="216" font-size="11" text-anchor="middle">2.5 s</text><text class="t1" x="278" y="103" font-size="12" text-anchor="end">Default cache</text><path class="s1" d="M290,88 H556.72 Q560.72,88 560.72,92 V106 Q560.72,110 556.72,110 H290 Z"/><text class="t1" x="568.72" y="103" font-size="12">1.41 s</text><text class="t1" x="278" y="143" font-size="12" text-anchor="end">Cache capped at 256 MiB</text><path class="s1" d="M290,128 H595.12 Q599.12,128 599.12,132 V146 Q599.12,150 595.12,150 H290 Z"/><text class="t1" x="607.12" y="143" font-size="12">1.61 s</text><text class="t1" x="278" y="183" font-size="12" text-anchor="end">Cache off</text><path class="s1" d="M290,168 H733.36 Q737.36,168 737.36,172 V186 Q737.36,190 733.36,190 H290 Z"/><text class="t1" x="745.36" y="183" font-size="12">2.33 s</text><text class="t2" x="24" y="256" font-size="11">Median seconds per reply after the first, 14-turn Kiki chat at one context size (8K).</text></svg>
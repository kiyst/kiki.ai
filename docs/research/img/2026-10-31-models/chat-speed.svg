</style><rect class="bg" width="860" height="300" rx="8"/><text class="t1" x="24" y="32" font-size="16" font-weight="600">Chat speed: one context size makes Gemma the fastest</text><text class="t2" x="24" y="52" font-size="12">Typical wait for a reply on the owner's PC (8 GB GTX 1080)</text><line class="grid" x1="270.0" x2="270.0" y1="74" y2="240"/><text class="t2" x="270.0" y="256" font-size="11" text-anchor="middle">0 s</text><line class="grid" x1="374.0" x2="374.0" y1="74" y2="240"/><text class="t2" x="374.0" y="256" font-size="11" text-anchor="middle">5 s</text><line class="grid" x1="478.0" x2="478.0" y1="74" y2="240"/><text class="t2" x="478.0" y="256" font-size="11" text-anchor="middle">10 s</text><line class="grid" x1="582.0" x2="582.0" y1="74" y2="240"/><text class="t2" x="582.0" y="256" font-size="11" text-anchor="middle">15 s</text><line class="grid" x1="686.0" x2="686.0" y1="74" y2="240"/><text class="t2" x="686.0" y="256" font-size="11" text-anchor="middle">20 s</text><line class="grid" x1="790.0" x2="790.0" y1="74" y2="240"/><text class="t2" x="790.0" y="256" font-size="11" text-anchor="middle">25 s</text><text class="t1" x="258" y="103" font-size="12" text-anchor="end">Today: v1 voice + Qwen3 4B</text><path class="s1" d="M270,88 H304.896 Q308.896,88 308.896,92 V106 Q308.896,110 304.896,110 H270 Z"/><text class="t1" x="316.896" y="103" font-size="12">1.9 s</text><text class="t1" x="258" y="143" font-size="12" text-anchor="end">Gemma voice + Qwen 3.5 technical</text><path class="s1" d="M270,128 H328.192 Q332.192,128 332.192,132 V146 Q332.192,150 328.192,150 H270 Z"/><text class="t1" x="340.192" y="143" font-size="12">3.0 s</text><text class="t1" x="258" y="183" font-size="12" text-anchor="end">Gemma alone, two context sizes</text><path class="s1" d="M270,168 H773.936 Q777.936,168 777.936,172 V186 Q777.936,190 773.936,190 H270 Z"/><text class="t1" x="785.936" y="183" font-size="12">24.4 s</text><text class="t1" x="258" y="223" font-size="12" text-anchor="end">Gemma alone, one context size</text><path class="s1" d="M270,208 H294.912 Q298.912,208 298.912,212 V226 Q298.912,230 294.912,230 H270 Z"/><text class="t1" x="306.912" y="223" font-size="12">1.4 s</text><text class="t2" x="24" y="286" font-size="11">Median seconds per reply after the first, 14-turn conversation. The 24 s case is a harness quirk: two context sizes forced Ollama to reload.</text></svg>
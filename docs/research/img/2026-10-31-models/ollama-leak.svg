</style><rect class="bg" width="860" height="250" rx="8"/><text class="t1" x="24" y="32" font-size="16" font-weight="600">Memory leak under Ollama: Gemma's is severe</text><text class="t2" x="24" y="52" font-size="12">Megabytes of committed memory added per request</text><line class="grid" x1="200.0" x2="200.0" y1="74" y2="200"/><text class="t2" x="200.0" y="216" font-size="11" text-anchor="middle">0</text><line class="grid" x1="280.0" x2="280.0" y1="74" y2="200"/><text class="t2" x="280.0" y="216" font-size="11" text-anchor="middle">10</text><line class="grid" x1="360.0" x2="360.0" y1="74" y2="200"/><text class="t2" x="360.0" y="216" font-size="11" text-anchor="middle">20</text><line class="grid" x1="440.0" x2="440.0" y1="74" y2="200"/><text class="t2" x="440.0" y="216" font-size="11" text-anchor="middle">30</text><line class="grid" x1="520.0" x2="520.0" y1="74" y2="200"/><text class="t2" x="520.0" y="216" font-size="11" text-anchor="middle">40</text><line class="grid" x1="600.0" x2="600.0" y1="74" y2="200"/><text class="t2" x="600.0" y="216" font-size="11" text-anchor="middle">50</text><line class="grid" x1="680.0" x2="680.0" y1="74" y2="200"/><text class="t2" x="680.0" y="216" font-size="11" text-anchor="middle">60</text><line class="grid" x1="760.0" x2="760.0" y1="74" y2="200"/><text class="t2" x="760.0" y="216" font-size="11" text-anchor="middle">70</text><text class="t1" x="188" y="103" font-size="12" text-anchor="end">Qwen3 4B (current)</text><text class="t1" x="208.0" y="103" font-size="12">0 MB</text><text class="t1" x="188" y="143" font-size="12" text-anchor="end">Qwen 3.5 4B</text><path class="s2" d="M200,128 H236.0 Q240.0,128 240.0,132 V146 Q240.0,150 236.0,150 H200 Z"/><text class="t1" x="248.0" y="143" font-size="12">5 MB</text><text class="t1" x="188" y="183" font-size="12" text-anchor="end">Gemma 4 E4B</text><path class="s3" d="M200,168 H748.0 Q752.0,168 752.0,172 V186 Q752.0,190 748.0,190 H200 Z"/><text class="t1" x="760.0" y="183" font-size="12">69 MB</text><text class="t2" x="24" y="236" font-size="11">Growth of the model process's committed memory per request under Ollama 0.40.12 (20 requests). Unloading resets it.</text></svg>
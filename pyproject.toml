[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deskai"
version = "0.1.0"
description = "Local-first assistant retrieval and tool-calling prototype"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pypdf>=5,<6",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
ollama = ["ollama>=0.4,<1"]

[project.scripts]
deskai = "deskai.cli:main"
kiki = "deskai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

